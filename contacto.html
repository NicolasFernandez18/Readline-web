<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | REDLINE</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { redline: { red: '#FF1A2D', dark: '#070709', card: '#0F0F14', border: '#22222A' } }
                }
            }
        }
    </script>
</head>
<body class="bg-redline-dark text-gray-100 font-sans antialiased">

    <!-- HEADER MENU -->
    <header class="fixed top-0 left-0 w-full z-50 bg-redline-dark/90 backdrop-blur-md border-b border-redline-border">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html"><img src="logo.jpg" alt="REDLINE" class="h-10 w-auto"></a>
            <nav class="hidden md:flex items-center gap-8 text-sm text-gray-300">
                <a href="index.html" class="hover:text-redline-red">Inicio</a>
                <a href="servicios.html" class="hover:text-redline-red">Servicios & Precios</a>
                <a href="portafolio.html" class="hover:text-redline-red">Portafolio</a>
                <a href="nosotros.html" class="hover:text-redline-red">Nosotros</a>
                <a href="contacto.html" class="text-redline-red font-bold">Contacto</a>
            </nav>
            <a href="contacto.html" class="hidden md:inline-flex px-5 py-2.5 text-sm font-semibold text-white bg-redline-red rounded-xl">Cotizar Web</a>
        </div>
    </header>

    <main class="pt-36 pb-24 max-w-4xl mx-auto px-4">
        <div class="bg-redline-card p-8 md:p-12 rounded-3xl border border-redline-border shadow-2xl">
            <h1 class="text-3xl md:text-5xl font-extrabold text-center mb-2">Hablemos de tu Proyecto</h1>
            <p class="text-gray-400 text-center text-sm mb-10">Completá los datos y coordinamos una propuesta adaptada a tus metas.</p>

            <form class="space-y-6" action="https://formspree.io/f/TU_CODIGO_AQUI" method="POST">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Nombre / Empresa</label>
                        <input type="text" name="nombre" required placeholder="Ej. Nicolas Fernandez" class="w-full bg-redline-dark border border-redline-border rounded-xl p-3.5 text-sm text-white focus:border-redline-red focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">WhatsApp / Teléfono</label>
                        <input type="tel" name="telefono" required placeholder="+54 11 1234 5678" class="w-full bg-redline-dark border border-redline-border rounded-xl p-3.5 text-sm text-white focus:border-redline-red focus:outline-none">
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Correo Electrónico</label>
                        <input type="email" name="email" required placeholder="tu@email.com" class="w-full bg-redline-dark border border-redline-border rounded-xl p-3.5 text-sm text-white focus:border-redline-red focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Tipo de Servicio</label>
                        <select name="servicio" class="w-full bg-redline-dark border border-redline-border rounded-xl p-3.5 text-sm text-gray-300 focus:border-redline-red focus:outline-none">
                            <option value="Landing Page">Landing Page One-Page</option>
                            <option value="Sitio Multipágina">Sitio Web Multipágina</option>
                            <option value="Desarrollo Laravel / Custom">Desarrollo a Medida / Laravel</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Mensaje / Requerimientos</label>
                    <textarea name="mensaje" rows="4" placeholder="Contanos sobre tu emprendimiento o las funcionalidades que necesitás..." class="w-full bg-redline-dark border border-redline-border rounded-xl p-3.5 text-sm text-white focus:border-redline-red focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full py-4 bg-redline-red text-white font-bold rounded-xl shadow-[0_0_20px_rgba(255,26,45,0.4)] hover:bg-red-600 transition-all">
                    Enviar Cotización
                </button>
            </form>
        </div>
    </main>

    <footer class="py-8 border-t border-redline-border text-center text-xs text-gray-500">
        <p>&copy; 2026 REDLINE. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
